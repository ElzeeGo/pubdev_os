#cloud-config
# Hetzner Cloud-Init Configuration for pubdev
# This script automatically sets up your server on first boot

# Update packages on first boot
package_update: true
package_upgrade: true

# Install required packages
packages:
  - nginx
  - git
  - curl
  - ufw
  - fail2ban
  - htop

# Create deploy user with sudo privileges
users:
  - name: deploy
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    # Add your SSH public key here (replace with your actual key)
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJl3dIeudNqd0VEAJ2Cw96Hjc9ZqM9Cx8B your_email@example.com

# Configure firewall
runcmd:
  # Update system
  - apt-get update
  - apt-get upgrade -y
  
  # Install Node.js 20.x LTS
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs
  
  # Install pnpm globally
  - npm install -g pnpm
  
  # Install PM2 globally
  - npm install -g pm2
  
  # Configure UFW firewall
  - ufw --force enable
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  
  # Start and enable services
  - systemctl enable nginx
  - systemctl start nginx
  - systemctl enable fail2ban
  - systemctl start fail2ban
  
  # Create application directory
  - mkdir -p /home/deploy/pubdev
  - chown -R deploy:deploy /home/deploy
  
  # Configure SSH (disable password authentication after SSH keys work)
  - sed -i 's/#PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
  - systemctl restart sshd
  
  # Clean up
  - apt-get autoremove -y
  - apt-get autoclean

# Reboot after setup (optional - uncomment if desired)
# power_state:
#   mode: reboot
#   message: Rebooting after cloud-init setup
#   timeout: 30

# Final message
final_message: "pubdev server setup complete! Time: $UPTIME seconds"

